<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Superview Quadratic Stretch</text>

  <!-- Arrow -->
  <line x1="408" y1="205" x2="445" y2="205" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Labels -->
  <text x="210" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Original (4:3)</text>
  <text x="700" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Stretched (16:9)</text>
  <text x="210" y="385" text-anchor="middle" font-size="11" fill="#888">Uniform grid</text>
  <text x="700" y="385" text-anchor="middle" font-size="11" fill="#888">Center preserved, edges stretched</text>

  <!-- ============ ORIGINAL 4:3 GRID ============ -->
  <!-- Box: 300x270 at (60, 70) -->
  <rect x="60" y="70" width="300" height="270" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Vertical grid lines: 15 lines, spacing = 300/16 = 18.75 -->
  <line x1="78.75"  y1="70" x2="78.75"  y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="97.5"   y1="70" x2="97.5"   y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="116.25" y1="70" x2="116.25" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="135"    y1="70" x2="135"    y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="153.75" y1="70" x2="153.75" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="172.5"  y1="70" x2="172.5"  y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="191.25" y1="70" x2="191.25" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="210"    y1="70" x2="210"    y2="340" stroke="#ff5533" stroke-width="1.5"/>
  <line x1="228.75" y1="70" x2="228.75" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="247.5"  y1="70" x2="247.5"  y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="266.25" y1="70" x2="266.25" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="285"    y1="70" x2="285"    y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="303.75" y1="70" x2="303.75" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="322.5"  y1="70" x2="322.5"  y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="341.25" y1="70" x2="341.25" y2="340" stroke="#4a9eff" stroke-width="0.8"/>

  <!-- Horizontal grid lines: 15 lines, spacing = 270/16 = 16.875 -->
  <line x1="60" y1="86.875"  x2="360" y2="86.875"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="103.75"  x2="360" y2="103.75"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="120.625" x2="360" y2="120.625" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="137.5"   x2="360" y2="137.5"   stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="154.375" x2="360" y2="154.375" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="171.25"  x2="360" y2="171.25"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="188.125" x2="360" y2="188.125" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="205"     x2="360" y2="205"     stroke="#ff5533" stroke-width="1.5"/>
  <line x1="60" y1="221.875" x2="360" y2="221.875" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="238.75"  x2="360" y2="238.75"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="255.625" x2="360" y2="255.625" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="272.5"   x2="360" y2="272.5"   stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="289.375" x2="360" y2="289.375" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="306.25"  x2="360" y2="306.25"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="60" y1="323.125" x2="360" y2="323.125" stroke="#4a9eff" stroke-width="0.8"/>

  <!-- ============ STRETCHED 16:9 GRID ============ -->
  <!-- Box: 480x270 at (460, 70) -->
  <rect x="460" y="70" width="480" height="270" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Vertical grid lines: quadratic stretch positions (computed from algorithm) -->
  <!-- Edges are spread apart, center lines are close together -->
  <line x1="515.65" y1="70" x2="515.65" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="554.36" y1="70" x2="554.36" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="585.91" y1="70" x2="585.91" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="613.24" y1="70" x2="613.24" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="637.68" y1="70" x2="637.68" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="660"    y1="70" x2="660"    y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="680.67" y1="70" x2="680.67" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="700"    y1="70" x2="700"    y2="340" stroke="#ff5533" stroke-width="1.5"/>
  <line x1="719.33" y1="70" x2="719.33" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="740"    y1="70" x2="740"    y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="762.32" y1="70" x2="762.32" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="786.76" y1="70" x2="786.76" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="814.09" y1="70" x2="814.09" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="845.64" y1="70" x2="845.64" y2="340" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="884.35" y1="70" x2="884.35" y2="340" stroke="#4a9eff" stroke-width="0.8"/>

  <!-- Horizontal grid lines: unchanged (no vertical stretch) -->
  <line x1="460" y1="86.875"  x2="940" y2="86.875"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="103.75"  x2="940" y2="103.75"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="120.625" x2="940" y2="120.625" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="137.5"   x2="940" y2="137.5"   stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="154.375" x2="940" y2="154.375" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="171.25"  x2="940" y2="171.25"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="188.125" x2="940" y2="188.125" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="205"     x2="940" y2="205"     stroke="#ff5533" stroke-width="1.5"/>
  <line x1="460" y1="221.875" x2="940" y2="221.875" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="238.75"  x2="940" y2="238.75"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="255.625" x2="940" y2="255.625" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="272.5"   x2="940" y2="272.5"   stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="289.375" x2="940" y2="289.375" stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="306.25"  x2="940" y2="306.25"  stroke="#4a9eff" stroke-width="0.8"/>
  <line x1="460" y1="323.125" x2="940" y2="323.125" stroke="#4a9eff" stroke-width="0.8"/>

  <!-- Legend -->
  <line x1="370" y1="370" x2="390" y2="370" stroke="#ff5533" stroke-width="1.5"/>
  <text x="395" y="374" font-size="11" fill="#666">Center line (preserved)</text>
  <line x1="520" y1="370" x2="540" y2="370" stroke="#4a9eff" stroke-width="0.8"/>
  <text x="545" y="374" font-size="11" fill="#666">Grid lines</text>
</svg>
