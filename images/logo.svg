<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 520 100"
    width="520"
    height="100"
>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5533;stop-opacity:1" />
    </linearGradient>
    <marker
            id="arrow"
            markerWidth="8"
            markerHeight="6"
            refX="8"
            refY="3"
            orient="auto"
        >
      <polygon points="0 0, 8 3, 0 6" fill="#ff5533" />
    </marker>
  </defs>

  <!-- 4:3 box (80x60, true 4:3 ratio) -->
  <rect
        x="12"
        y="20"
        width="80"
        height="60"
        rx="3"
        fill="none"
        stroke="#4a9eff"
        stroke-width="2.5"
    />
  <!-- Grid: 4 cols, 3 rows -->
  <line
        x1="32"
        y1="20"
        x2="32"
        y2="80"
        stroke="#4a9eff"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="52"
        y1="20"
        x2="52"
        y2="80"
        stroke="#4a9eff"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="72"
        y1="20"
        x2="72"
        y2="80"
        stroke="#4a9eff"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="12"
        y1="40"
        x2="92"
        y2="40"
        stroke="#4a9eff"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="12"
        y1="60"
        x2="92"
        y2="60"
        stroke="#4a9eff"
        stroke-width="0.7"
        opacity="0.5"
    />
  <text
        x="52"
        y="95"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="9"
        fill="#999"
    >4:3</text>

  <!-- Arrow -->
  <path
        d="M 100 50 L 124 50"
        stroke="url(#grad)"
        stroke-width="2.5"
        fill="none"
        marker-end="url(#arrow)"
    />

  <!-- 16:9 box (~107x60, true 16:9 ratio) -->
  <rect
        x="134"
        y="20"
        width="106.7"
        height="60"
        rx="3"
        fill="none"
        stroke="#ff5533"
        stroke-width="2.5"
    />
  <!-- Stretched grid: non-linear spacing (edges wider, center tighter) -->
  <line
        x1="151"
        y1="20"
        x2="151"
        y2="80"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.4"
    />
  <line
        x1="178"
        y1="20"
        x2="178"
        y2="80"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="198"
        y1="20"
        x2="198"
        y2="80"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="224"
        y1="20"
        x2="224"
        y2="80"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.4"
    />
  <line
        x1="134"
        y1="40"
        x2="240.7"
        y2="40"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.5"
    />
  <line
        x1="134"
        y1="60"
        x2="240.7"
        y2="60"
        stroke="#ff5533"
        stroke-width="0.7"
        opacity="0.5"
    />
  <text
        x="187.3"
        y="95"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="9"
        fill="#999"
    >16:9</text>

  <!-- Text -->
  <text
        x="262"
        y="45"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        fill="#222"
    >superview</text>
  <text
        x="262"
        y="68"
        font-family="monospace"
        font-size="15"
        fill="#888"
    >-rs</text>
  <text
        x="300"
        y="68"
        font-family="sans-serif"
        font-size="11"
        fill="#aaa"
    >dynamic 4:3 to 16:9 stretch</text>
</svg>
